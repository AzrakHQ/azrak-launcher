[package]
name = "launcher"
version.workspace = true
edition.workspace = true

[features]
default = ["native-pc"]
native-pc = ["dep:native-pc"]
toy = ["dep:testkit"]

[lib]
name = "launcher"
path = "src/lib.rs"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
ui-model.workspace = true
kernel.workspace = true
engines.workspace = true
application.workspace = true
host.workspace = true
serde_json.workspace = true
native-pc = { workspace = true, optional = true }
testkit = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
testkit.workspace = true
