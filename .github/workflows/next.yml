name: next
on:
  push:
    paths: ["next/**", ".github/workflows/next.yml"]
  pull_request:
    paths: ["next/**", ".github/workflows/next.yml"]
jobs:
  workspace:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: next } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: next }
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --no-default-features --features launcher/toy -- -D warnings
      - run: cargo test --workspace --no-default-features --features launcher/toy,launcher/native-pc,launcher-ui/toy,launcher-ui/native-pc
      - name: Removal matrix
        run: ./scripts/removal-matrix.sh
      - name: Screenshots
        run: python3 scripts/shots.py
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: "next/target/shots/*.png" }
