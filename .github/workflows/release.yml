name: Release

# Builds on Ubuntu 22.04 (glibc 2.35) so the binary runs on most distros from the last few years,
# and attaches a ready-to-install archive to the published GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      NAME: azrak-linux-x86_64
      # Launchers from before the rename (PS5 Launcher 1.16 and older) update from this name, with
      # the binary at ps5-launcher-linux-x86_64/ps5-launcher; it moves them over on first start.
      OLD_NAME: ps5-launcher-linux-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/package-licenses.test.mjs
          mkdir -p "dist/$NAME/assets"
          cp target/release/azrak install.sh README.md "dist/$NAME/"
          cp assets/azrak.svg "dist/$NAME/assets/"
          node scripts/package-licenses.mjs "dist/$NAME" --allow-upstream
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          # The same files for older launchers, the binary also by its old name (a hard link: the
          # archive stores it once).
          cp -a "dist/$NAME" "dist/$OLD_NAME"
          ln "dist/$OLD_NAME/azrak" "dist/$OLD_NAME/ps5-launcher"
          tar -C dist -czf "dist/$OLD_NAME.tar.gz" "$OLD_NAME"
          (cd dist && sha256sum "$OLD_NAME.tar.gz" > "$OLD_NAME.tar.gz.sha256")
          ls -la dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "dist/$NAME.tar.gz" "dist/$NAME.tar.gz.sha256" \
            "dist/$OLD_NAME.tar.gz" "dist/$OLD_NAME.tar.gz.sha256" --clobber
