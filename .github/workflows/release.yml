name: Release

# Release Please keeps a release pull request open on main. It collects the Conventional Commit
# messages since the last release, bumps the version in Cargo.toml / Cargo.lock and writes
# CHANGELOG.md. Merging that pull request creates a *draft* release and tag; package.yml then
# builds the Linux and macOS binaries and attaches them, and only then is the release published.
# The app's self-updater reads the latest published release, so it never sees one without binaries.
#
# Packaging is a called workflow, not an `on: release` one, because GitHub doesn't start workflows
# from events its own workflow token causes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write   # for os.yml, which pushes the OS images

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with the default token don't start CI. To get checks on the
          # release pull request, add a personal access token (or GitHub App token) as the
          # RELEASE_PLEASE_TOKEN secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  package:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
      ref: ${{ needs.release-please.outputs.sha }}

  publish:
    needs: [release-please, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.release-please.outputs.tag }}" --draft=false

  # The OS image and ISO take the Linux tarball of the release that was just published.
  os:
    needs: publish
    uses: ./.github/workflows/os.yml
