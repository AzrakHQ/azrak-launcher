name: PS5 Launcher OS

# The OS images (see os/) and the installer ISO.
# - Images: ghcr.io/<owner>/ps5-launcher-os:stable (AMD/Intel) and :nvidia (Bazzite + the
#   launcher), and :minimal (Fedora bootc + Gamescope + the launcher, os/minimal). Rebuilt daily
#   so installed machines get their base's updates; they update themselves from these tags.
# - ISO: Fedora's network installer with os/ps5-launcher-os.ks, attached to the latest release.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: Build the installer ISO and attach it to the latest release
        type: boolean
        default: true
  # After a launcher release is packaged, so the image seeds the new version.
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: ps5-launcher-os
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: stable
            base: ghcr.io/ublue-os/bazzite-deck:stable
            file: os/Containerfile
          - tag: nvidia
            base: ghcr.io/ublue-os/bazzite-deck-nvidia:stable
            file: os/Containerfile
          - tag: minimal
            base: quay.io/fedora/fedora-bootc:44
            file: os/minimal/Containerfile
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Unpack the latest launcher release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'ps5-launcher-linux-x86_64.tar.gz*' --dir /tmp/release
          (cd /tmp/release && sha256sum -c ps5-launcher-linux-x86_64.tar.gz.sha256)
          tar -C /tmp/release -xzf /tmp/release/ps5-launcher-linux-x86_64.tar.gz
          mv /tmp/release/ps5-launcher-linux-x86_64 os/launcher
          os/launcher/ps5-launcher --version

      - name: Build
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/ps5-launcher-os" >> "$GITHUB_ENV"
          sudo podman build --pull=always --build-arg BASE_IMAGE=${{ matrix.base }} \
            --build-arg VERSION="$(date -u +%Y.%m.%d)" -f ${{ matrix.file }} \
            -t "ghcr.io/$owner/ps5-launcher-os:${{ matrix.tag }}" os

      - name: Check the image
        if: matrix.tag != 'minimal'
        run: |
          img="$IMAGE:${{ matrix.tag }}"
          sudo podman run --rm --entrypoint /usr/bin/bash "$img" -c '
            set -e
            test -x /usr/libexec/ps5-launcher-os/start
            test -x /usr/libexec/ps5-launcher-os/ensure-user
            systemctl is-enabled ps5-launcher-os-ensure-user.service bazzite-autologin.service
            test -f /etc/xdg/autostart/ps5-launcher-os.desktop
            test -f /etc/bazzite/desktop_autologin
            /usr/share/ps5-launcher-os/release/ps5-launcher --version
            for tool in xdotool mpv yt-dlp; do command -v "$tool" || { echo "missing $tool"; exit 1; }; done
            # Loaded at run time by name (trailers, archive installs).
            for lib in libmpv.so.2 libarchive.so.13; do ldconfig -p | grep -q "$lib " || { echo "missing $lib"; exit 1; }; done
            for f in /etc/xdg/autostart/org.kde.plasma-welcome.desktop /etc/xdg/autostart/steam.desktop \
                     /etc/xdg/autostart/bazzite-announcement.desktop /etc/skel/Desktop/Return.desktop; do
              test ! -e "$f" || { echo "should be gone: $f"; exit 1; }
            done
            grep -q kinoite /usr/share/ublue-os/image-info.json
            test -x /usr/libexec/bazzite-autologin'

      - name: Check the minimal image
        if: matrix.tag == 'minimal'
        run: |
          sudo podman run --rm --entrypoint /usr/bin/bash "$IMAGE:minimal" -c '
            set -e
            test -x /usr/libexec/ps5-launcher-os/session
            test -s /usr/lib/ps5-launcher-os/release
            systemctl is-enabled greetd.service NetworkManager.service bluetooth.service ps5-launcher-os-update.timer
            test "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = masked
            grep -q systemd.gpt_auto=0 /usr/lib/bootc/install/50-ps5-launcher-os.toml
            for tool in gamescope cage xprop xdotool nmcli bluetoothctl pactl rpm-ostree bootc; do
              command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
            done
            for lib in libmpv.so.2 libarchive.so.13 libxkbcommon-x11.so.0 libvulkan.so.1 libpulse.so.0 libXss.so.1; do
              ldconfig -p | grep -q "$lib " || { echo "missing $lib"; exit 1; }
            done
            /usr/share/ps5-launcher-os/release/ps5-launcher --version'

      - name: Push
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="$IMAGE:${{ matrix.tag }}"
          sudo podman tag "$img" "$img-$(date -u +%Y%m%d)"
          for ref in "$img" "$img-$(date -u +%Y%m%d)"; do
            for try in 1 2 3; do sudo podman push "$ref" && break; [ "$try" = 3 ] && exit 1; sleep 30; done
          done

  iso:
    needs: image
    # Only when asked or after a release: the ISO installs the current image, so it doesn't
    # need rebuilding with every image update.
    if: github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.iso)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the ISO
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src -e ISO_CACHE=/src fedora:44 \
            os/build-iso.sh ps5-launcher-os-x86_64.iso
          sha256sum ps5-launcher-os-x86_64.iso > ps5-launcher-os-x86_64.iso.sha256
          size=$(stat -c %s ps5-launcher-os-x86_64.iso)
          echo "ISO: $size bytes"
          test "$size" -lt 2000000000
      - name: Attach to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            ps5-launcher-os-x86_64.iso ps5-launcher-os-x86_64.iso.sha256
