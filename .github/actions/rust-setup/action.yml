name: Rust setup
description: Rust toolchain, the system packages the build needs, and a dependency cache.
inputs:
  targets:
    description: Extra Rust targets, comma-separated
    default: ""
  cache-key:
    description: Extra cache key, to keep unrelated jobs' caches apart
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
    - name: Linux system packages
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev
    # The cache key includes Cargo.lock, so changed dependencies rebuild and the rest is reused.
    # cache-on-failure keeps the dependencies from a failed run for the retry.
    - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        cache-on-failure: true
