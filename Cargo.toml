[package]
name = "ps5-launcher"
version = "1.16.1"
edition = "2021"
description = "A fast, native PS5-style game launcher for Linux and macOS"
rust-version = "1.92"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "5"
qoi = "0.4"
sha1_smol = "1"
libc = "0.2"
libloading = "0.8"
flate2 = "1"
html-escape = "0.2"
percent-encoding = "2"
sha2 = "0.10"
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
anyhow = "1"
url = "2"
data-encoding = "2"

# Controller input on macOS (Linux reads evdev directly; see src/gamepad.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# gilrs-core refuses to build without a Windows backend feature, even on macOS; xinput is inert here.
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

# For CI: the same optimization as release (tests run at release speed) but without LTO and with
# more codegen units, so linking takes a fraction of the time. Release builds still use `release`.
[profile.ci]
inherits = "release"
lto = "off"
codegen-units = 16
strip = "none"

# Decoding images in debug builds is painfully slow; optimize dependencies even there.
[profile.dev.package."*"]
opt-level = 2
